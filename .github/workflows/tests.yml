name: tests

on:
  push:
  pull_request:

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      # No DATABASE_URL and no RAILWAY_ENVIRONMENT, so the suite runs on the
      # SQLite fallback. Postgres is deliberately not required here: CI has to
      # stay runnable by anyone with a checkout.
      - name: Run tests
        run: python -m pytest -q
